<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--green-deep); color: var(--white); font-family: 'Inter', sans-serif; font-size: 15px; min-height: 100vh; }
  .site-header { background: var(--green-deep); padding: 16px 16px 0; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--card-border); }
  .site-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--gold); line-height: 1; margin-bottom: 2px; }
  .site-sub { font-size: 11px; color: var(--grey-mid); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  .leaderboard-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .leaderboard-strip::-webkit-scrollbar { display: none; }
  .lb-card { flex: 0 0 auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 12px; min-width: 88px; text-align: center; }
  .lb-card.first-place { border-color: var(--gold); }
  .lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 11px; color: var(--grey-mid); letter-spacing: 1px; }
  .lb-card.first-place .lb-rank { color: var(--gold); }
  .lb-name { font-size: 12px; font-weight: 600; color: var(--white); margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .lb-pts { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }
  .lb-pts-label { font-size: 10px; color: var(--grey-mid); }
  .nav-tabs { display: flex; background: var(--green-deep); border-bottom: 2px solid var(--card-border); }
  .nav-tab { flex: 1; padding: 12px 4px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--grey-mid); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color 0.15s, border-color 0.15s; }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }
  .group-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .group-card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--card-border); }
  .group-card-title { display: flex; align-items: center; gap: 10px; }
  .group-letter-badge { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .group-owner { font-size: 13px; font-weight: 600; color: var(--white); }
  .group-owner-sub { font-size: 11px; color: var(--grey-mid); }
  .group-total-pts { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--gold); line-height: 1; text-align: right; }
  .group-total-label { font-size: 10px; color: var(--grey-mid); text-align: right; }
  .team-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--card-border); font-size: 13px; }
  .team-row:last-child { border-bottom: none; }
  .team-left { display: flex; align-items: center; gap: 8px; }
  .tier-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .team-pts-val { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); }
  .team-pts-val.zero { color: var(--grey-mid); }
  .scoring-key { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .scoring-key h3 { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--gold); margin-bottom: 10px; }
  .score-rule { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--card-border); font-size: 13px; color: var(--grey-light); }
  .score-rule:last-child { border-bottom: none; }
  .score-pts { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); }
  .date-header { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: var(--gold); margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--card-border); }
  .date-header:first-child { margin-top: 0; }
  .fixture-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .fixture-meta { font-size: 10px; color: var(--grey-mid); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .fixture-teams { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fixture-team { flex: 1; font-size: 13px; font-weight: 600; color: var(--white); }
  .fixture-team.home { text-align: left; }
  .fixture-team.away { text-align: right; }
  .fixture-score { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); white-space: nowrap; min-width: 52px; text-align: center; }
  .fixture-score.pending { color: var(--grey-mid); font-size: 16px; }
  .fixture-pens { text-align: center; font-size: 10px; color: var(--grey-mid); margin-top: 2px; }
  .sweepstake-badges { display: flex; justify-content: space-between; margin-top: 8px; }
  .sw-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .filter-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 4px; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn { flex: 0 0 auto; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--card-border); background: transparent; color: var(--grey-mid); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn.active { background: var(--gold); color: var(--green-deep); border-color: var(--gold); }
  .stage-section { margin-bottom: 20px; }
  .stage-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--card-border); }

  {stage:'qf',  label:'Quarter-Finals', count:4},
  {stage:'sf',  label:'Semi-Finals', count:2},
  {stage:'final',label:'Final', count:1}
];
const knockoutFixtures = [];
KNOCKOUT_STAGES.forEach(({stage,label,count})=>{
  for(let i=0;i<count;i++) knockoutFixtures.push({stage,label,home:null,away:null,homeScore:null,awayScore:null,penWinner:null});
});

// Apply RESULTS to group fixtures
const fixtures = GROUP_FIXTURES.map(f => {
  const key = `${f.home} vs ${f.away}`;
  const r = RESULTS[key];
  return { ...f, stage:'group', homeScore: r ? r.homeScore : null, awayScore: r ? r.awayScore : null, penWinner: null };
});

function getSWGroup(name){
  return SWEEPSTAKE_GROUPS.find(g => g.teams.find(t => t.n === name))?.letter || null;
}

function calcPoints(){
  const pts={};
  SWEEPSTAKE_GROUPS.forEach(g=>{
    pts[g.letter]={total:0,player:g.player,teams:{}};
    g.teams.forEach(t=>pts[g.letter].teams[t.n]=0);
  });
  [...fixtures,...knockoutFixtures].forEach(f=>{
    if(f.homeScore===null||f.awayScore===null||!f.home||!f.away)return;
    const hg=getSWGroup(f.home), ag=getSWGroup(f.away);
    const hs=Number(f.homeScore), as=Number(f.awayScore);
    if(f.stage==='group'){
      if(hs>as){ if(hg){pts[hg].teams[f.home]=(pts[hg].teams[f.home]||0)+2;pts[hg].total+=2;} }
      else if(as>hs){ if(ag){pts[ag].teams[f.away]=(pts[ag].teams[f.away]||0)+2;pts[ag].total+=2;} }
      else{
        if(hg){pts[hg].teams[f.home]=(pts[hg].teams[f.home]||0)+1;pts[hg].total+=1;}
        if(ag){pts[ag].teams[f.away]=(pts[ag].teams[f.away]||0)+1;pts[ag].total+=1;}
      }
    } else {
      let winner=null;
      if(hs>as)winner=f.home; else if(as>hs)winner=f.away; else if(f.penWinner)winner=f.penWinner;
      if(winner){const wg=getSWGroup(winner);if(wg){pts[wg].teams[winner]=(pts[wg].teams[winner]||0)+3;pts[wg].total+=3;}}
    }
  });
  return pts;
}

const TIER_DOT=['','td-1','td-2','td-3','td-4','td-5','td-6'];
const GC={A:'gc-A',B:'gc-B',C:'gc-C',D:'gc-D',E:'gc-E',F:'gc-F',G:'gc-G',H:'gc-H'};
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function renderLeaderboard(){
  const pts=calcPoints();
  const ranked=SWEEPSTAKE_GROUPS.map(g=>({letter:g.letter,player:g.player,pts:pts[g.letter].total}))
    .sort((a,b)=>b.pts-a.pts);
  document.getElementById('leaderboardStrip').innerHTML=ranked.map((r,idx)=>`
    <div class="lb-card ${idx===0?'first-place':''}">
      <div class="lb-rank">${idx===0?'🏆':ordinal(idx+1)}</div>
      <div class="lb-name" title="${r.player}">${r.player}</div>
      <div class="lb-pts">${r.pts}</div>
      <div class="lb-pts-label">pts · Grp ${r.letter}</div>
    </div>`).join('');
}

function renderGroupsTab(){
  const pts=calcPoints();
  document.getElementById('tab-groups').innerHTML=SWEEPSTAKE_GROUPS.map(g=>{
    const total=pts[g.letter].total;
    return`<div class="group-card">
      <div class="group-card-header">
        <div class="group-card-title">
          <div class="group-letter-badge ${GC[g.letter]}">Grp ${g.letter}</div>
          <div><div class="group-owner">${g.player}</div><div class="group-owner-sub">Sweepstake Group ${g.letter}</div></div>
        </div>
        <div><div class="group-total-pts">${total}</div><div class="group-total-label">total pts</div></div>
      </div>
      ${g.teams.map(t=>{const tp=pts[g.letter].teams[t.n]||0;return`
        <div class="team-row">
          <div class="team-left"><div class="tier-dot ${TIER_DOT[t.tier]}"></div><span>${t.n}</span></div>
          <span class="team-pts-val ${tp===0?'zero':''}">${tp}</span>
        </div>`;}).join('')}
    </div>`;
  }).join('');
}

let activeFilter='group';
function renderFixturesTab(){
  const stages=['group','r32','r16','qf','sf','final'];
  const labels={group:'Group Stage',r32:'Round of 32',r16:'Round of 16',qf:'Quarter-Finals',sf:'Semi-Finals',final:'Final'};
  const filterHtml=`<div class="filter-bar">${stages.map(s=>`<button class="filter-btn ${activeFilter===s?'active':''}" onclick="setFilter('${s}')">${labels[s]}</button>`).join('')}</div>`;
  let body='';
  if(activeFilter==='group'){
    const byDate={};
    fixtures.forEach(f=>{(byDate[f.date]=byDate[f.date]||[]).push(f);});
    body=Object.entries(byDate).map(([date,fs])=>`
      <div class="date-header">${date}</div>
      ${fs.map(fixtureCard).join('')}`).join('');
  } else {
    const sf=knockoutFixtures.filter(f=>f.stage===activeFilter);
    body=`<div class="stage-section"><div class="stage-title">${labels[activeFilter]}</div>${sf.map(fixtureCard).join('')}</div>`;
  }
  document.getElementById('tab-fixtures').innerHTML=filterHtml+body;
}

function fixtureCard(f){
  const home=f.home||'TBD', away=f.away||'TBD';
  const hg=f.home?getSWGroup(f.home):null, ag=f.away?getSWGroup(f.away):null;
  const hg_data=hg?SWEEPSTAKE_GROUPS.find(g=>g.letter===hg):null;
  const ag_data=ag?SWEEPSTAKE_GROUPS.find(g=>g.letter===ag):null;
  const scoreHtml=f.homeScore!==null?`<div class="fixture-score">${f.homeScore}–${f.awayScore}</div>`:`<div class="fixture-score pending">vs</div>`;
  const hBadge=hg_data?`<span class="sw-badge ${GC[hg]}">Grp ${hg} · ${hg_data.player}</span>`:'<span></span>';
  const aBadge=ag_data?`<span class="sw-badge ${GC[ag]}">Grp ${ag} · ${ag_data.player}</span>`:'<span></span>';
  const pens=f.penWinner?`<div class="fixture-pens">${f.penWinner} won on pens</div>`:'';
  const grpLabel=f.wcGroup?`WC Group ${f.wcGroup}`:(f.label||'Knockout');
  return`<div class="fixture-card">
    <div class="fixture-meta"><span>${grpLabel}</span>${f.homeScore!==null?'<span style="color:#4CAF50">✓ Done</span>':''}</div>
    <div class="fixture-teams"><div class="fixture-team home">${home}</div>${scoreHtml}<div class="fixture-team away">${away}</div></div>
    ${pens}<div class="sweepstake-badges">${hBadge}${aBadge}</div>
  </div>`;
}

function setFilter(s){activeFilter=s;renderFixturesTab();}

function renderSetupTab(){
  document.getElementById('tab-setup').innerHTML=`
    <div class="scoring-key">
      <h3>Scoring Rules</h3>
      <div class="score-rule"><span>Group stage win</span><span class="score-pts">2 pts</span></div>
      <div class="score-rule"><span>Group stage draw</span><span class="score-pts">1 pt</span></div>
      <div class="score-rule"><span>Group stage loss</span><span class="score-pts">0 pts</span></div>
      <div class="score-rule"><span>Each knockout round survived</span><span class="score-pts">3 pts</span></div>
      <div class="score-rule"><span style="font-weight:600">Max possible (tournament winner)</span><span class="score-pts" style="color:#fff">24 pts</span></div>
    </div>
    <div class="scoring-key">
      <h3>Sweepstake Draw</h3>
      ${SWEEPSTAKE_GROUPS.map(g=>`
        <div class="score-rule" style="flex-direction:column;align-items:flex-start;gap:4px">
          <div style="display:flex;align-items:center;gap:8px;width:100%">
            <span class="sw-badge ${GC[g.letter]}" style="font-family:'Bebas Neue',sans-serif;font-size:13px;padding:3px 8px">Grp ${g.letter}</span>
            <span style="font-weight:600">${g.player}</span>
          </div>
          <div style="font-size:12px;color:var(--grey-mid);padding-left:4px">${g.teams.map(t=>t.n).join(', ')}</div>
        </div>`).join('')}
    </div>`;
}

function renderAll(){renderLeaderboard();renderGroupsTab();renderFixturesTab();renderSetupTab();}
function showTab(name,el){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');el.classList.add('active');
}

renderAll();
</script>
</body>
</html>
