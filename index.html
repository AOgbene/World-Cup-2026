<style>

  .lb-pts { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }
  .lb-pts-label { font-size: 10px; color: var(--grey-mid); }

  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }

  .group-owner-sub { font-size: 11px; color: var(--grey-mid); }
  .group-total-pts { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--gold); line-height: 1; text-align: right; }
  .group-total-label { font-size: 10px; color: var(--grey-mid); text-align: right; }
  .team-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--card-border); font-size: 13px; }
  .team-row:last-child { border-bottom: none; }
  .team-left { display: flex; align-items: center; gap: 8px; }
  .tier-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .team-pts-val { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); }
  .team-pts-val.zero { color: var(--grey-mid); }
  .setup-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

  .filter-bar::-webkit-scrollbar { display: none; }

  { home: "Portugal",   away: "DR Congo",   homeScore: null, awayScore: null },

// ============================================================
//  END OF RESULTS SECTION — do not edit below this line
// ============================================================

const ALL_TEAMS = [
  {r:1,n:"France"},{r:2,n:"Spain"},{r:3,n:"Argentina"},{r:4,n:"England"},
  {r:5,n:"Portugal"},{r:6,n:"Brazil"},{r:7,n:"Netherlands"},{r:8,n:"Morocco"},
  {r:9,n:"Belgium"},{r:10,n:"Germany"},{r:11,n:"Croatia"},{r:12,n:"Colombia"},

  {r:17,n:"Japan"},{r:18,n:"Switzerland"},{r:19,n:"South Korea"},{r:20,n:"Austria"},

function getTier(r){if(r<=8)return 1;if(r<=16)return 2;if(r<=24)return 3;if(r<=32)return 4;if(r<=40)return 5;return 6;}

const raw=Array.from({length:8},()=>[]);
for(let g=0;g<8;g++) raw[g].push(ALL_TEAMS[g]);
for(let g=0;g<8;g++) raw[g].push(ALL_TEAMS[47-g]);
for(let g=0;g<8;g++) raw[g].push(ALL_TEAMS[8+g]);
for(let g=0;g<8;g++) raw[g].push(ALL_TEAMS[39-g]);
for(let g=0;g<8;g++) raw[g].push(ALL_TEAMS[16+g]);
for(let g=0;g<8;g++) raw[g].push(ALL_TEAMS[31-g]);
const SWEEPSTAKE_GROUPS=raw.map((members,i)=>({id:i+1,teams:members.map(t=>({...t,tier:getTier(t.r)})).sort((a,b)=>a.r-b.r)}));

const WC_GROUPS={
  A:["Mexico","South Korea","Czechia","South Africa"],
  B:["Canada","Qatar","Switzerland","Bosnia & Herz."],
  C:["Brazil","Morocco","Haiti","Scotland"],
  D:["USA","Paraguay","Australia","Türkiye"],
  E:["Germany","Ivory Coast","Ecuador","Curaçao"],
  F:["Netherlands","Japan","Sweden","Tunisia"],
  G:["Belgium","Egypt","Iran","New Zealand"],
  H:["Spain","Cape Verde","Saudi Arabia","Uruguay"],
  I:["France","Senegal","Iraq","Norway"],
  J:["Argentina","Algeria","Austria","Jordan"],
  K:["Portugal","DR Congo","Uzbekistan","Colombia"],
  L:["England","Croatia","Ghana","Panama"]
};

function buildFixtures(){
  const f=[];
  Object.entries(WC_GROUPS).forEach(([grp,teams])=>{
    for(let i=0;i<teams.length;i++) for(let j=i+1;j<teams.length;j++)
      f.push({stage:'group',wcGroup:grp,home:teams[i],away:teams[j],homeScore:null,awayScore:null,penWinner:null});
  });
  [{stage:'r32',label:'Round of 32',count:16},{stage:'r16',label:'Round of 16',count:8},
   {stage:'qf',label:'Quarter-Finals',count:4},{stage:'sf',label:'Semi-Finals',count:2},
   {stage:'final',label:'Final',count:1}].forEach(({stage,label,count})=>{
    for(let i=0;i<count;i++) f.push({stage,label,home:null,away:null,homeScore:null,awayScore:null,penWinner:null});
  });
  return f;
}

function applyResults(fixtures){
  RESULTS.forEach(r=>{
    if(r.homeScore===null&&r.awayScore===null) return; // skip unplayed
    const f=fixtures.find(f=>f.home===r.home&&f.away===r.away);
    if(f){
      f.homeScore=r.homeScore;
      f.awayScore=r.awayScore;
      f.penWinner=r.penWinner||null;
    } else {
      const ko=fixtures.find(f=>f.stage!=='group'&&f.home===null&&r.home!=='TBD');
      if(ko){ko.home=r.home;ko.away=r.away;ko.homeScore=r.homeScore;ko.awayScore=r.awayScore;ko.penWinner=r.penWinner||null;}
    }
  });
  return fixtures;
}

const PLAYERS=["Kaodi","Luis","Niamh","Sinead","Peter","Aoibhne","Mel","Liam"];
const GROUP_LETTERS=["G","H","C","F","E","B","A","D"];

const fixtures=applyResults(buildFixtures());

function getSWGroup(name){for(const g of SWEEPSTAKE_GROUPS)if(g.teams.find(t=>t.n===name))return g.id;return null;}

function calcPoints(){
  const pts={};
  SWEEPSTAKE_GROUPS.forEach(g=>{pts[g.id]={total:0,teams:{}};g.teams.forEach(t=>pts[g.id].teams[t.n]=0);});
  fixtures.forEach(f=>{
    if(f.homeScore===null||f.awayScore===null||!f.home||!f.away)return;
    const hg=getSWGroup(f.home),ag=getSWGroup(f.away);
    const hs=Number(f.homeScore),as=Number(f.awayScore);
    if(f.stage==='group'){
      if(hs>as){if(hg){pts[hg].teams[f.home]=(pts[hg].teams[f.home]||0)+2;pts[hg].total+=2;}}
      else if(as>hs){if(ag){pts[ag].teams[f.away]=(pts[ag].teams[f.away]||0)+2;pts[ag].total+=2;}}
      else{
        if(hg){pts[hg].teams[f.home]=(pts[hg].teams[f.home]||0)+1;pts[hg].total+=1;}
        if(ag){pts[ag].teams[f.away]=(pts[ag].teams[f.away]||0)+1;pts[ag].total+=1;}
      }
    } else {
      let winner=null;
      if(hs>as)winner=f.home;else if(as>hs)winner=f.away;else if(f.penWinner)winner=f.penWinner;
      if(winner){const wg=getSWGroup(winner);if(wg){pts[wg].teams[winner]=(pts[wg].teams[winner]||0)+3;pts[wg].total+=3;}}
    }
  });
  return pts;
}

const TIER_DOT=['','td-1','td-2','td-3','td-4','td-5','td-6'];
const GC=['','gc-1','gc-2','gc-3','gc-4','gc-5','gc-6','gc-7','gc-8'];
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function renderLeaderboard(){
  const pts=calcPoints();
  const ranked=SWEEPSTAKE_GROUPS.map((g,i)=>({
    id:g.id,letter:GROUP_LETTERS[i],player:PLAYERS[i],pts:pts[g.id].total
  })).sort((a,b)=>b.pts-a.pts);
  document.getElementById('leaderboardStrip').innerHTML=ranked.map((r,idx)=>`
    <div class="lb-card ${idx===0?'first-place':''}">
      <div class="lb-rank">${idx===0?'🏆':ordinal(idx+1)}</div>
      <div class="lb-name" title="${r.player}">${r.player}</div>
      <div class="lb-pts">${r.pts}</div>
      <div class="lb-pts-label">pts · Grp ${r.letter}</div>
    </div>`).join('');
}

function renderGroupsTab(){
  const pts=calcPoints();
  document.getElementById('tab-groups').innerHTML=SWEEPSTAKE_GROUPS.map((g,gi)=>{
    const letter=GROUP_LETTERS[gi],player=PLAYERS[gi],total=pts[g.id].total;
    return`<div class="group-card">
      <div class="group-card-header">
        <div class="group-card-title">
          <div class="group-letter-badge ${GC[g.id]}">Grp ${letter}</div>
          <div><div class="group-owner">${player}</div><div class="group-owner-sub">Sweepstake Group ${g.id}</div></div>
        </div>
        <div><div class="group-total-pts">${total}</div><div class="group-total-label">total pts</div></div>
      </div>
      ${g.teams.map(t=>{const tp=pts[g.id].teams[t.n]||0;return`
        <div class="team-row">
          <div class="team-left"><div class="tier-dot ${TIER_DOT[t.tier]}"></div><span>${t.n}</span></div>
          <span class="team-pts-val ${tp===0?'zero':''}">${tp}</span>
        </div>`;}).join('')}
    </div>`;
  }).join('');
}

let activeFilter='group';
function renderFixturesTab(){
  const stages=['group','r32','r16','qf','sf','final'];
  const labels={group:'Group Stage',r32:'Round of 32',r16:'Round of 16',qf:'Quarter-Finals',sf:'Semi-Finals',final:'Final'};
  const filterHtml=`<div class="filter-bar">${stages.map(s=>`<button class="filter-btn ${activeFilter===s?'active':''}" onclick="setFilter('${s}')">${labels[s]}</button>`).join('')}</div>`;
  const stageFixtures=fixtures.filter(f=>f.stage===activeFilter);
  let body='';
  if(activeFilter==='group'){
    const byG={};stageFixtures.forEach(f=>{(byG[f.wcGroup]=byG[f.wcGroup]||[]).push(f);});
    body=Object.entries(byG).map(([g,fs])=>`<div class="stage-section"><div class="stage-title">WC Group ${g}</div>${fs.map(fixtureCard).join('')}</div>`).join('');
  } else {
    body=`<div class="stage-section"><div class="stage-title">${labels[activeFilter]}</div>${stageFixtures.map(fixtureCard).join('')}</div>`;
  }
  document.getElementById('tab-fixtures').innerHTML=filterHtml+body;
}

function fixtureCard(f){
  const home=f.home||'TBD',away=f.away||'TBD';
  const hg=f.home?getSWGroup(f.home):null,ag=f.away?getSWGroup(f.away):null;
  const scoreHtml=f.homeScore!==null?`<div class="fixture-score">${f.homeScore}–${f.awayScore}</div>`:`<div class="fixture-score pending">vs</div>`;
  const hBadge=hg?`<span class="sw-badge ${GC[hg]}">Grp ${GROUP_LETTERS[hg-1]} · ${PLAYERS[hg-1]}</span>`:'<span></span>';
  const aBadge=ag?`<span class="sw-badge ${GC[ag]}">Grp ${GROUP_LETTERS[ag-1]} · ${PLAYERS[ag-1]}</span>`:'<span></span>';
  const pens=f.penWinner?`<div class="fixture-pens">${f.penWinner} won on pens</div>`:'';
  return`<div class="fixture-card">
    <div class="fixture-meta"><span>${f.wcGroup?'WC Group '+f.wcGroup:(f.label||'Knockout')}</span>${f.homeScore!==null?'<span style="color:#4CAF50">✓ Done</span>':''}</div>
    <div class="fixture-teams"><div class="fixture-team home">${home}</div>${scoreHtml}<div class="fixture-team away">${away}</div></div>
    ${pens}<div class="sweepstake-badges">${hBadge}${aBadge}</div>
  </div>`;
}

function setFilter(s){activeFilter=s;renderFixturesTab();}

function renderSetupTab(){
  document.getElementById('tab-setup').innerHTML=`
    <div class="scoring-key">
      <h3>Scoring Rules</h3>
      <div class="score-rule"><span>Group stage win</span><span class="score-pts">2 pts</span></div>
      <div class="score-rule"><span>Group stage draw</span><span class="score-pts">1 pt</span></div>
      <div class="score-rule"><span>Group stage loss</span><span class="score-pts">0 pts</span></div>
      <div class="score-rule"><span>Each knockout round survived</span><span class="score-pts">3 pts</span></div>
      <div class="score-rule"><span style="font-weight:600">Max possible (tournament winner)</span><span class="score-pts" style="color:#fff">24 pts</span></div>
    </div>
    <div class="scoring-key">
      <h3>Group Pairings</h3>
      <p style="font-size:12px;color:var(--grey-mid);margin-bottom:10px">Top ranked team paired with bottom ranked team. All groups score 21 strength points.</p>
      ${SWEEPSTAKE_GROUPS.map((g,gi)=>{
        const top=g.teams[0],bot=g.teams[g.teams.length-1];
        return`<div class="score-rule">
          <span><span style="font-size:11px;padding:2px 6px;border-radius:4px;margin-right:6px;font-family:'Bebas Neue',sans-serif" class="${GC[g.id]}">Grp ${GROUP_LETTERS[gi]}</span>${PLAYERS[gi]}</span>
          <span style="font-size:12px;color:var(--grey-mid)">#${top.r} ${top.n} + #${bot.r} ${bot.n}</span>
        </div>`;}).join('')}
    </div>`;
}

function renderAll(){renderLeaderboard();renderGroupsTab();renderFixturesTab();renderSetupTab();}
function showTab(name,el){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');el.classList.add('active');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

renderAll();
</script>
</body>
